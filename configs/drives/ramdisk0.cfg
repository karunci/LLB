; Personal Research Operating System (PROS)
; Drive Manifest Configuration

[Volume]
VolumeID     = "ramdisk0"
DeviceName   = "Boot Ramdisk (Initrd USTAR)"
DeviceDriver = "driver.ramdisk"
Partition    = 0
Letter       = "X"
Label        = "PROS_BOOT"
FileSystem   = "USTAR"
ReadOnly     = True
Status       = "Mounted"
MountPath    = "\"

