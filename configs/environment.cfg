; Personal Research Operating System (PROS)
; System Environment Configuration
; Values strictly mirror include/Version.bas

[System]
OS_NAME          = "Personal Research Operating System"
OS_SHORT_NAME    = "PRK-OS"
OS_IDENTIFIER    = "PROS"
KERNEL_NAME      = "Personal Research Kernel"
HOST_NAME        = "pros-station"
VERSION_TAG      = "REV: 2026.10.30-r38-re10"

[Environment]
; Semicolon-delimited search order for command execution
PATH             = ".;X:\System\Apps\CoreUtils;X:\System\Apps;X:\Apps;X:\System\Services;X:\System\Drivers"
DEFAULT_DRIVE    = "X"
DEFAULT_USER     = "Default"
PROMPT_STYLE     = "compact"

